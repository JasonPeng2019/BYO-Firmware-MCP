# Pinned CMSIS-Pack provisioning manifest.
#
# WHY THIS EXISTS: the shipped server must not depend on a possibly incomplete
# live cmsis-pack-manager index (`pyocd pack update` / `pyocd pack install`).
#
# Instead, each pack below is fetched DETERMINISTICALLY by one pinned URL and
# verified by sha256 (see `pyocd_debug_mcp.pack_provision`, invoked by
# `host_bootstrap.py --install-packs` / the setup scripts). pyOCD then loads the
# local .pack files via its `pack` option in the shared backend.
#
# The .pack files themselves are NOT committed (gitignored); only this manifest
# is tracked. To update a pin: bump version + url, recompute sha256
# (`Get-FileHash -Algorithm SHA256` / `shasum -a 256`), commit.

packs:
  - id: Keil.STM32L4xx_DFP
    version: "3.1.0"
    filename: Keil.STM32L4xx_DFP.3.1.0.pack
    url: https://www.keil.com/pack/Keil.STM32L4xx_DFP.3.1.0.pack
    sha256: 5672383c07fbdcee0e471a33f4f8beb2e1f3200bc999244dcd6858e0e8e8203f
    provides_targets:
      - stm32l476rgtx
    needed_by_boards:
      - nucleo_l476rg
    device_bindings:
      - part_number: STM32L476RGT6
        pdsc_device: STM32L476RGTx
        pyocd_target: stm32l476rgtx
        identity_proof:
          capability: compatible
          address: 3758366720 # DBGMCU_IDCODE (0xE0042000)
          expected: 1045
          mask: 4095
          width_bits: 32
          label: STM32L476 compatible DBGMCU_IDCODE
    note: Provides the exact stm32l476rgtx target for the Nucleo-L476RG.

# nRF52833 / nRF52840 targets are normally built into pyOCD, so no Nordic DFP is
# pinned here. Add one the same way if a supported installation requires it.
