# BYO Server package metadata.
[project]
name = "pyocd-debug-mcp"
version = "0.1.8rc1"
description = "Headless local MCP server for embedded debug and flash control via pyOCD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2.0,<2",
    "platformdirs>=4",
    "psutil>=5.9",
    "pyocd>=0.44.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentry-sdk>=2",
]

[project.optional-dependencies]
# The default installation deliberately keeps CAN backend libraries out of the
# process. The static off-mode tool inventory and all non-CAN functions work
# without this extra; an operator must install it before selecting a CAN
# profile at startup.
can = [
    "python-can==4.6.1",
    "pyroute2==0.9.6; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/JasonPeng2019/BYO-Firmware-MCP"
Issues = "https://github.com/JasonPeng2019/BYO-Firmware-MCP/issues"

[project.scripts]
byo-mcp-sidecar = "pyocd_debug_mcp.sidecar:main"
pyocd-debug-mcp = "pyocd_debug_mcp.cli:main"
pyocd-pack-repair = "pyocd_debug_mcp.pack_index_repair:main"
pyocd-collect-artifacts = "pyocd_debug_mcp.artifact_collector:main"
pyocd-native-build = "pyocd_debug_mcp.native_build:main"

[dependency-groups]
build = [
    "nuitka==2.8.9",
    "ordered-set==4.1.0",
    "zstandard==0.25.0",
]
dev = [
    "pyright>=1.1",
    "ruff>=0.6",
    "tomli>=2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Runtime board knowledge and generated evidence are project-owned. The one
# packaged YAML file is an inert, software-only example, not runtime authority.
packages = ["src/pyocd_debug_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSES/Apache-2.0.txt" = "pyocd_debug_mcp/licenses/Apache-2.0.txt"
"THIRD_PARTY_NOTICES.md" = "pyocd_debug_mcp/licenses/THIRD_PARTY_NOTICES.md"
"fixtures/can/virtual_rx_only.yaml" = "pyocd_debug_mcp/examples/can/virtual_rx_only.yaml"
"SERVER_GUIDE.md" = "pyocd_debug_mcp/docs/SERVER_GUIDE.md"
"docs" = "pyocd_debug_mcp/docs"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/SERVER_GUIDE.md",
    "/LICENSES/Apache-2.0.txt",
    "/THIRD_PARTY_NOTICES.md",
    "/client-workspace",
    "/docs",
    "/fixtures/can/virtual_rx_only.yaml",
    "/pyproject.toml",
    "/uv.lock",
    "/scripts",
    "/skills",
    "/src/pyocd_debug_mcp",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pyright]
include = ["src", "scripts", "client-workspace"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
