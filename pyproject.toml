# BYO Server package metadata.
[project]
name = "pyocd-debug-mcp"
version = "0.1.0"
description = "Headless local MCP server for embedded debug and flash control via pyOCD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2.0",
    "platformdirs>=4",
    "psutil>=5.9",
    "pyocd>=0.44.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentry-sdk>=2",
]

[project.scripts]
pyocd-debug-mcp = "pyocd_debug_mcp.server:main"
pyocd-pack-repair = "pyocd_debug_mcp.pack_index_repair:main"
pyocd-collect-artifacts = "pyocd_debug_mcp.artifact_collector:main"
pyocd-native-build = "pyocd_debug_mcp.native_build:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Runtime board knowledge and generated evidence are project-owned; the package
# intentionally contains only generic server code and protocol metadata.
packages = ["src/pyocd_debug_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/pyocd_debug_mcp",
]

[tool.ruff]
target-version = "py310"
line-length = 100
