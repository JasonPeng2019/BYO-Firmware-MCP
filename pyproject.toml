# BYO Server package metadata.
[project]
name = "byo-firmware-mcp"
version = "0.2.0"
description = "Headless local MCP server for provider-neutral firmware build, flash, and debug work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "filelock>=3.16",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "psutil>=5.9",
    "pyocd>=0.44.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
byo-firmware-mcp = "firmware_mcp.server:main"
firmware-pack-repair = "firmware_mcp.pack_index_repair:main"
firmware-collect-artifacts = "firmware_mcp.artifact_collector:main"
firmware-native-build = "firmware_mcp.native_build:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Runtime board knowledge and generated evidence are project-owned; the package
# intentionally contains only generic server code and protocol metadata.
packages = ["src/firmware_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/firmware_mcp",
]

[tool.ruff]
target-version = "py310"
line-length = 100
