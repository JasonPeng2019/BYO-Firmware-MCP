# PROJECT-DEFINED: BYO-only package metadata. The duplicated-tree and legal
# disposition decisions remain open in the extraction ledger.
[project]
name = "pyocd-debug-mcp"
version = "0.1.0"
description = "Headless local MCP server for embedded debug and flash control via pyOCD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2.0",
    "psutil>=5.9",
    "pyocd>=0.44.0",
    "pyelftools>=0.33",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
pyocd-debug-mcp = "pyocd_debug_mcp.server:main"
pyocd-pack-repair = "pyocd_debug_mcp.pack_index_repair:main"
pyocd-zephyr-build = "pyocd_debug_mcp.zephyr_build:main"
pyocd-collect-artifacts = "pyocd_debug_mcp.artifact_collector:main"
pyocd-native-build = "pyocd_debug_mcp.native_build:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Checkout-owned boards, firmware, packs, cases, and scripts are intentionally
# not package data. The installed wheel is a build/import artifact, not a
# supported operational deployment; see README.md and docs/architecture.md.
packages = ["src/pyocd_debug_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/pyocd_debug_mcp",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
