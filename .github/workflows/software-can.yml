name: Software CAN

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-can:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Report pinned build toolchain
        run: uv --version
      - name: Install locked software test environment
        run: uv sync --locked --extra can --group dev
      - name: Lint release and CAN implementation
        run: >-
          uv run --locked --extra can ruff check
          src tests scripts client-workspace client-workspace/bin/attach-project
      - name: Check Python formatting
        env:
          BYO_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BYO_FORMAT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          uv run --locked --extra can python
          scripts/verify_changed_python_format.py
      - name: Type-check the package
        run: >-
          uv run --locked --extra can pyright
          src scripts client-workspace client-workspace/bin/attach-project
      - name: Verify evidence privacy manifest
        run: >-
          uv run --locked --extra can python
          scripts/verify_evidence_privacy.py
      - name: Verify retained release evidence consistency
        run: >-
          uv run --locked --extra can python
          scripts/verify_release_evidence.py
      - name: Run software CAN and package tests
        run: >-
          uv run --locked --extra can python -m unittest discover
          -s tests -p 'test_*.py' -v
      - name: Verify clean wheel and sdist installs
        run: >-
          uv run --locked --extra can python
          scripts/verify_release_artifacts.py
      - name: Build and reverify exact release handoff bytes
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra can python scripts/verify_release_artifacts.py --keep-dist release-dist
          uv run --locked --extra can python scripts/verify_release_artifacts.py release-dist
          sha256sum release-dist/* | tee release-dist/SHA256SUMS
      - name: Retain exact verified release handoff bytes
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pyocd-debug-mcp-0.1.8rc1
          path: release-dist/
          if-no-files-found: error
          retention-days: 30

  native-can-simulation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked CAN test environment
        run: uv sync --locked --extra can --group dev
      - name: Keep simulation output outside the source checkout
        shell: bash
        run: |
          printf '%s\n' "PYOCD_MCP_RUNS_ROOT=${RUNNER_TEMP}/byo-can-owned-runs" >> "$GITHUB_ENV"
          printf '%s\n' "BYO_CAN_ACCEPTANCE_EVIDENCE_DIR=${RUNNER_TEMP}/native-can-evidence" >> "$GITHUB_ENV"
      - name: Run native simulation and MCP acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          uv run --locked --extra can python -m unittest -v
          tests.test_can_native_sim tests.test_can_mcp_sim_e2e
          tests.test_can_config_gate tests.test_can_worker_virtual
          tests.test_can_session tests.test_can_tools tests.test_can_server_contract
          tests.test_monitor_paths.MonitorStoreRootTests.test_identity_persists_without_optional_fchmod
      - name: Preserve Windows registry and junction regressions
        if: runner.os == 'Windows'
        run: >-
          uv run --locked --extra can python -m unittest -v
          tests.test_remote_probes.LoadSaveTests.test_cross_process_registrations_do_not_lose_acknowledged_entries
          tests.test_tiered_acceptance_workspace.TieredWorkspaceAcceptanceTests.test_native_windows_workspace_junction_is_rejected_without_external_writes
      - name: Verify native macOS and Linux evidence I/O
        if: runner.os != 'Windows'
        run: uv run --locked --extra can python -m unittest tests.test_release_evidence -v
      - name: Verify macOS workspace attachment and SWD cleanup
        if: runner.os == 'macOS'
        run: >-
          uv run --locked --extra can python -m unittest -v
          tests.test_tiered_acceptance_workspace tests.test_swd_process_isolation
          tests.test_process_cleanup
      - name: Provision dedicated Linux vcan
        if: runner.os == 'Linux'
        run: |
          if ! sudo modprobe vcan; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev byovcan0 type vcan
          sudo ip link set dev byovcan0 up
      - name: Run kernel vcan integration
        if: runner.os == 'Linux'
        env:
          BYO_VCAN_TEST_INTERFACE: byovcan0
          BYO_VCAN_ALLOW_LINK_MUTATION: "1"
        run: uv run --locked --extra can python -m unittest tests.test_can_vcan_integration -v
      - name: Remove dedicated Linux vcan
        if: always() && runner.os == 'Linux'
        run: sudo ip link delete byovcan0 2>/dev/null || true
      - name: Retain software simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-can-${{ matrix.os }}
          path: ${{ runner.temp }}/native-can-evidence/
          if-no-files-found: warn
          retention-days: 30
