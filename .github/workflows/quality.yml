name: Firmware MCP quality

on:
  pull_request:
  push:
    branches:
      - InstallerV1

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false

      - name: Recreate locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run python -m unittest discover -s tests

      - name: Sidecar self-test from outside the checkout
        shell: bash
        run: |
          # PLAN.md 5b: run the hardware-free self-test from a working directory
          # OUTSIDE the source tree, so any regression that reintroduces cwd /
          # in-checkout .env / relative data-file authority fails here in CI
          # instead of on a customer's packaged build. The interpreter and
          # dependencies come from the project's synced venv (via --project);
          # only the process working directory is external.
          work="${RUNNER_TEMP}/byo-sidecar-self-test-outside"
          mkdir -p "$work"
          cd "$work"
          uv run --project "$GITHUB_WORKSPACE" pyocd-debug-mcp self-test
