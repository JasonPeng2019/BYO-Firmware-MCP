name: FR09 repair material and per-command source observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uart-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Preserve exact exported LF source bytes
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out diagnostic overlay and exact bound source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: false

      - name: Install actual locked dependencies
        id: dependencies
        run: uv sync --locked --all-groups

      - name: Record source and run all independent diagnostic controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        env:
          FR09_EVIDENCE: ${{ runner.temp }}/MCP_Server_Dev/development/fr09-diagnostic-evidence
        run: |
          git rev-parse HEAD
          uv run --no-sync python .diagnostics/fr09_diagnostic.py --source . --evidence "$FR09_EVIDENCE"

      - name: Retain every diagnostic command, method and raw failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fr09-repair-material-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/MCP_Server_Dev/development/fr09-diagnostic-evidence/
          if-no-files-found: warn
          retention-days: 90
